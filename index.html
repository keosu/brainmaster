<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0a0e1f" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="给小朋友的益智游戏合集：记忆、计算、逻辑、空间、反应，每天 5 分钟练出最强大脑。" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="脑力大师" />
<meta name="format-detection" content="telephone=no" />
<title>Brain Master · 脑力大师</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./src/styles/base.css" />
<link rel="stylesheet" href="./src/styles/layout.css" />
<link rel="stylesheet" href="./src/styles/components.css" />
</head>
<body>
  <script>
    // 兜底：模块加载失败时给出可见提示，避免只剩空白页
    (function () {
      function fail(msg) {
        var app = document.getElementById('app');
        if (!app) return;
        app.innerHTML = '<div style="padding:28px;font:14px/1.7 system-ui;color:#e6ecff">' +
          '<h2 style="margin:0 0 10px">页面没能启动</h2>' +
          '<p style="color:#8fa0c7;margin:0 0 14px">' + msg + '</p>' +
          '<p style="color:#8fa0c7;margin:0">请用开发服务器打开（不要直接双击 index.html）：<br>' +
          '<code style="color:#6ee7ff">npm run dev</code> 然后访问 <code style="color:#6ee7ff">http://127.0.0.1:8123/</code></p></div>';
      }
      window.addEventListener('error', function (e) {
        if (e && e.message && /Failed to (fetch|resolve)|module/i.test(e.message)) fail(e.message);
      });
      setTimeout(function () {
        if (document.querySelector('.boot')) {
          fail('脚本加载超时，可能是通过 file:// 直接打开，导致 ES 模块被浏览器拦截。');
        }
      }, 6000);
    })();
  </script>
  <div id="app" class="app">
    <div class="boot">
      <div class="boot__brain"></div>
      <p>加载中…</p>
    </div>
  </div>
  <div id="overlay-root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
